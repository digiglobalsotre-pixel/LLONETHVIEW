<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TIKTOK LIVE LLONETHVIEW</title>
<style>
:root{
 --bg:#030303;--panel:#050505;--line:#333;
 --white:#f8f8f8;--muted:#aaa;
 --red:#ff1738;--red2:#a90d25;--redGlow:#ff3355;
 --gold:#ffc400;--gold2:#a87d00;
}
*{box-sizing:border-box}
body{
 margin:0;background:#000;color:var(--white);font-family:Arial,Helvetica,sans-serif;
 min-height:100vh;
}
.app{
 max-width:1360px;margin:0 auto;padding:14px;
 background:#020202;border:1px solid #3a3a3a;border-radius:17px;
 box-shadow:0 0 30px #000;
}
.header{position:relative;text-align:center;padding:3px 18px 15px}
.tiktok{font-size:16px;font-weight:900;letter-spacing:5px;margin-bottom:3px}
.tiktok:before,.tiktok:after{content:"";display:inline-block;width:145px;height:1px;background:var(--red);vertical-align:middle;margin:0 16px;box-shadow:0 0 5px var(--red)}
.brand{
 font-size:clamp(48px,8vw,96px);font-weight:1000;letter-spacing:5px;line-height:.95;
 color:#f8f8f8;text-shadow:3px 3px 0 #ff2141,-2px 0 0 #ddd;
}
.crown{position:absolute;right:35px;top:18px;font-size:70px;color:var(--gold);filter:drop-shadow(0 0 7px #f4b900)}
.tiktok-icon{position:absolute;left:40px;top:35px;font-size:68px;text-shadow:-4px 3px 0 #18e9ef,4px -2px 0 #ff1744}
.prompt{
 margin-top:16px;border:2px solid var(--red);border-radius:15px;height:78px;
 display:flex;align-items:center;justify-content:center;
 font-size:clamp(26px,4vw,46px);font-family:cursive;font-style:italic;font-weight:700;
 box-shadow:0 0 10px #3d0008 inset;
}
.prompt span{color:var(--red);font-family:Arial;margin:0 38px;font-size:26px}


.topDonor{
  margin-top:18px;padding:14px;border:2px solid var(--gold);border-radius:16px;
  background:linear-gradient(180deg,#120f00,#030303);
  box-shadow:0 0 18px #5a4500 inset,0 0 12px #6e5300;
  text-align:center;
}
.topDonorTitle{color:var(--gold);font-size:18px;font-weight:1000;letter-spacing:2px;margin-bottom:7px}
.topDonorName{
  color:#ffd84a;font-size:clamp(28px,5vw,48px);font-weight:1000;line-height:1.08;
  text-shadow:0 0 5px #ffdf55,2px 2px 0 #6e5300;overflow-wrap:anywhere;
}
.topDonorEmpty{color:#8d7b36;font-size:14px}
.donorButtons{display:flex;justify-content:center;gap:8px;margin-top:10px}
.donorButtons button{
  padding:9px 14px;border-radius:8px;border:1px solid var(--gold);
  background:#0b0900;color:#ffd84a;font-weight:900;cursor:pointer
}
.rosePanel .goldNameAction{
  grid-column:1/-1;border-color:var(--gold);color:#ffd84a;
  background:linear-gradient(180deg,#171100,#080600);
}

.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}
.panel{border:1px solid;border-radius:16px;padding:13px 14px 15px;background:#020202;min-height:650px}
.rosePanel{border-color:var(--red);box-shadow:0 0 13px #300008 inset}
.tapPanel{border-color:var(--gold);box-shadow:0 0 13px #2b2200 inset}
.panelTitle{text-align:center;font-size:39px;font-weight:1000;margin:0 0 7px}
.rosePanel .panelTitle{color:var(--red);text-shadow:0 0 7px #6d0012}
.tapPanel .panelTitle{color:var(--gold);text-shadow:0 0 7px #6e5300}
.total{
 width:max-content;margin:0 auto 20px;padding:7px 19px;border:1px solid;border-radius:8px;
 background:#030303;font-size:16px;font-weight:900
}
.rosePanel .total{border-color:var(--red)}.tapPanel .total{border-color:var(--gold)}
.total b{font-size:23px;margin-left:12px}.rosePanel .total b{color:var(--red)}.tapPanel .total b{color:var(--gold)}

.list{
 display:grid;grid-template-columns:1fr;gap:10px;
 min-height:330px;align-content:start;
}
.card{
 width:100%;min-width:0;min-height:64px;height:auto;padding:10px 10px;border:1px solid;border-radius:9px;
 display:flex;align-items:center;gap:7px;background:#020202
}
.rosePanel .card{border-color:var(--red)}.tapPanel .card{border-color:var(--gold)}
.cardIcon{font-size:27px;flex:none}
.name{
 font-size:20px;font-weight:900;white-space:normal;overflow:visible;text-overflow:clip;
 overflow-wrap:break-word;word-break:normal;line-height:1.12;flex:1;min-width:0;text-align:left;
}
.rosePanel .name{text-transform:uppercase}.tapPanel .name{text-transform:uppercase;font-weight:800}
.remove{margin-left:auto;flex:none;background:none;border:0;color:#fff;font-size:29px;line-height:1;padding:0;cursor:pointer}

.empty{
 grid-column:1/-1;display:flex;align-items:center;justify-content:center;
 min-height:300px;color:#444;font-size:15px
}
.panelButtons{display:grid;grid-template-columns:1fr .82fr;gap:20px;margin-top:16px}
.action{
 height:58px;border-radius:7px;font-size:19px;font-weight:900;cursor:pointer;
 border:1px solid;background:#100307;color:#ff4963
}
.rosePanel .action.primary{background:linear-gradient(#e9274b,#c30c2d);color:#fff;border-color:#f22}
.tapPanel .action.primary{background:linear-gradient(#c99c10,#8e6b00);color:#fff;border-color:var(--gold)}
.rosePanel .action.secondary{border-color:var(--red);color:#ff526b}
.tapPanel .action.secondary{border-color:var(--gold);color:#f2c32d}
.copy{
 grid-column:1/-1;background:#030303!important;color:#fff!important;border-color:var(--red)!important;
}
.tapPanel .copy{border-color:var(--gold)!important}

.bottomNav{
 display:grid;grid-template-columns:repeat(5,1fr);gap:24px;margin:20px 13px 0
}
.nav{
 height:65px;border:1px solid #3c3c3c;background:#090909;border-radius:7px;color:#ddd;
 font-size:16px;font-weight:800;cursor:pointer
}
.nav b{font-size:20px}.nav .badge{
 display:inline-block;margin-left:8px;padding:5px 9px;border-radius:50%;font-size:14px;color:#fff
}
.redBadge{background:var(--red)}.goldBadge{background:#e6ad00}

.footer{text-align:center;margin:15px 0 0;color:#bbb;font-size:16px}
.footer span{color:var(--red);font-size:22px;margin:0 7px}

.modalBack{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal{width:min(480px,100%);background:#0a0a0a;border:1px solid #444;border-radius:16px;padding:20px}
.modal h3{margin-top:0}.modal input{width:100%;padding:13px;border-radius:9px;border:1px solid #444;background:#000;color:#fff;font-size:16px}
.tapIconPicker{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.tapIconChoice{padding:10px 8px;border-radius:9px;border:1px solid #555;background:#151515;color:#fff;font-weight:900;cursor:pointer}.tapIconChoice.selected{border-color:var(--gold);color:var(--gold);box-shadow:0 0 7px #6e5300}.modalBtns{display:flex;gap:8px;margin-top:12px}.modalBtns button{flex:1;padding:12px;border-radius:9px;border:1px solid #444;background:#191919;color:#fff;font-weight:900}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#fff;color:#000;border-radius:30px;padding:11px 18px;font-weight:900;opacity:0;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:850px){
 .app{padding:8px;border-radius:10px}.tiktok:before,.tiktok:after{width:55px;margin:0 6px}.tiktok{font-size:11px;letter-spacing:3px}
 .brand{font-size:45px;letter-spacing:3px}.crown{right:10px;top:10px;font-size:34px}.tiktok-icon{left:10px;top:22px;font-size:35px}
 .prompt{height:58px;font-size:25px}.prompt span{margin:0 10px;font-size:18px}
 .columns{gap:7px;margin-top:10px}.panel{padding:9px;min-height:510px;border-radius:12px}
 .panelTitle{font-size:22px}.total{font-size:11px;padding:5px 9px;margin-bottom:12px}.total b{font-size:16px}
 .list{grid-template-columns:1fr;gap:7px}.card{min-height:49px;height:auto;padding:7px 8px}.cardIcon{font-size:19px}.name{font-size:13px;white-space:normal;line-height:1.05}.remove{font-size:22px}
 .empty{min-height:250px}.panelButtons{grid-template-columns:1fr;gap:6px;margin-top:8px}.action{height:43px;font-size:12px}.copy{grid-column:auto}
 .bottomNav{grid-template-columns:repeat(2,1fr);gap:7px;margin:10px 0}.nav{height:48px;font-size:11px}.nav b{font-size:15px}
 .footer{font-size:12px}
}
@media(max-width:480px){
 .brand{font-size:32px}.crown{font-size:28px}.tiktok-icon{font-size:29px}.prompt{font-size:20px}
 .panelTitle{font-size:18px}.name{font-size:11px;white-space:normal;line-height:1.05}.cardIcon{font-size:16px}.remove{font-size:18px}
 .panel{min-height:480px}.bottomNav{grid-template-columns:repeat(2,1fr)}
}
</style>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="LLONETHVIEW">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
</head>
<body>
<div class="app">
<header class="header">
 <div class="tiktok">TIKTOK LIVE</div>
 <div class="tiktok-icon">♪</div>
 <div class="crown">♕</div>
 <div class="brand">LLONETHVIEW</div>
 <div class="prompt"><span>〰</span>Comenta Tu nombre<span>〰</span></div>
</header>


<div class="topDonor">
  <div class="topDonorTitle">👑 ✦ MEJOR DONADOR ✦ 👑</div>
  <div id="topDonorName" class="topDonorEmpty">Aún no hay donador destacado</div>
  <div class="donorButtons">
    <button onclick="setTopDonor()">👑 COLOCAR NOMBRE</button>
    <button onclick="clearTopDonor()">× QUITAR</button>
  </div>
</div>

<div class="columns">
<section class="panel rosePanel">
 <div class="panelTitle">✦ 🌹 ROSAS ✦</div>
 <div class="total">TOTAL: <b id="roseTotal">0</b></div>
 <div id="roseList" class="list"></div>
 <div class="panelButtons">
  <button class="action primary" onclick="openAdd('rosa')">＋ AGREGAR ROSA</button>
  <button class="action secondary" onclick="clearType('rosa')">▣ LIMPIAR TODOS</button>
  <button class="action copy" onclick="copyType('rosa')">▣ &nbsp; COPIAR TODOS LOS NOMBRES</button>
 </div>
</section>

<section class="panel tapPanel">
 <div class="panelTitle">♕ ✦ TAP TAP ✦</div>
 <div class="total">TOTAL: <b id="tapTotal">0</b></div>
 <div id="tapList" class="list"></div>
 <div class="panelButtons">
  <button class="action primary" onclick="openAdd('tap')">＋ AGREGAR TAP TAP</button>
  <button class="action secondary" onclick="clearType('tap')">▣ LIMPIAR TODOS</button>
  <button class="action copy" onclick="copyType('tap')">▣ &nbsp; COPIAR TODOS LOS NOMBRES</button>
 </div>
</section>
</div>

<nav class="bottomNav">
 <button class="nav" onclick="scrollTo(0,0)">♧ &nbsp; CONTADORES</button>
 <button class="nav" onclick="openAdd('rosa')">🌹 &nbsp; ROSAS <span class="badge redBadge" id="roseBadge">0</span></button>
 <button class="nav" onclick="openAdd('tap')">♕ &nbsp; TAP TAP <span class="badge goldBadge" id="tapBadge">0</span></button>
 <button class="nav" onclick="copyAll()">▣ &nbsp; COPIAR TODO</button>
 <button class="nav" onclick="settings()">⚙ &nbsp; AJUSTES</button>
</nav>
<div class="footer"><span>♥</span>Gracias por tu apoyo<span>♥</span></div>
</div>

<div class="modalBack" id="modalBack">
 <div class="modal">
  <h3 id="modalTitle">Agregar</h3>
  <input id="modalInput" placeholder="Escribe el nombre...">
  <div class="modalBtns">
   <button onclick="closeModal()">CANCELAR</button>
   <button onclick="confirmAdd()">AGREGAR</button>
  </div>
 </div>
</div>
<div id="toast" class="toast">Listo</div>

<script>
const KEY='llonethview_exact_panel_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"rosa":[],"tap":[],"topDonor":""}');
data.topDonor=data.topDonor||'';
data.rosa=data.rosa||[];
data.tap=(data.tap||[]).map(x=>typeof x==='string'?{name:x,icon:'♕'}:x);
let pendingType='rosa';
let pendingTapIcon='♕';
const $=id=>document.getElementById(id);

function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function openAdd(type){
 pendingType=type;
 $('modalTitle').textContent=type==='rosa'?'AGREGAR ROSA':'AGREGAR TAP TAP';
 $('modalInput').value='';
 pendingTapIcon='♕';
 const picker=$('tapIconPicker');
 if(picker) picker.style.display=type==='tap'?'grid':'none';
 updateTapIconButtons();
 $('modalBack').style.display='flex';
 setTimeout(()=>$('modalInput').focus(),50);
}
function chooseTapIcon(icon){pendingTapIcon=icon;updateTapIconButtons()}
function updateTapIconButtons(){
 $('tapHeartBtn').classList.toggle('selected',pendingTapIcon==='♡');
 $('tapCrownBtn').classList.toggle('selected',pendingTapIcon==='♕');
}
function closeModal(){$('modalBack').style.display='none'}
function confirmAdd(){
  const n=$('modalInput').value.trim();
  if(!n){ $('modalInput').focus(); return; }
  if(pendingType==='gold'){
    data.topDonor=n;
    save();closeModal();toast('Nombre dorado agregado');return;
  }
  if(pendingType==='tap') data.tap.push({name:n,icon:pendingTapIcon||'♕'});
  else data.rosa.push(n);
  save();closeModal();toast('Nombre agregado');
}
$('modalInput').addEventListener('keydown',e=>{if(e.key==='Enter')confirmAdd();if(e.key==='Escape')closeModal()});

function remove(type,i){data[type].splice(i,1);save()}
function clearType(type){
 if(confirm('¿Quieres limpiar todos los nombres de '+(type==='rosa'?'ROSAS':'TAP TAP')+'?')){
  data[type]=[];save();toast('Lista limpiada');
 }
}
function renderList(type,id,icon){
 const el=$(id);el.innerHTML='';
 if(!data[type].length){
  el.innerHTML='<div class="empty">Los nombres aparecerán aquí</div>';return;
 }
 data[type].forEach((item,i)=>{
  const c=document.createElement('div');c.className='card';
  const itemIcon=type==='tap'?(item.icon||'♕'):icon;
  const itemName=type==='tap'?(item.name||''):item;
  const ic=document.createElement('span');ic.className='cardIcon';ic.textContent=itemIcon;
  const name=document.createElement('span');name.className='name';name.textContent=itemName;
  const x=document.createElement('button');x.className='remove';x.textContent='×';x.onclick=()=>remove(type,i);
  c.append(ic,name,x);el.appendChild(c);
 });
}
function render(){
  const donor=$('topDonorName');
  if(donor){
    if(data.topDonor){
      donor.className='topDonorName';
      donor.textContent='👑 ♡ 🌹  '+data.topDonor+'  🌹 ♡ 👑';
    }else{
      donor.className='topDonorEmpty';
      donor.textContent='Aún no hay donador destacado';
    }
  }
 renderList('rosa','roseList','🌹');renderList('tap','tapList','♕');
 $('roseTotal').textContent=data.rosa.length;$('tapTotal').textContent=data.tap.length;
 $('roseBadge').textContent=data.rosa.length;$('tapBadge').textContent=data.tap.length;
}
function copyType(type){
 const txt=data[type].map(n=>(type==='rosa'?'🌹 ':'♕ ')+n).join('\\n');
 if(!txt){toast('No hay nombres');return} copy(txt)
}
function copyAll(){
 const txt=[...data.rosa.map(n=>'🌹 '+n),...data.tap.map(n=>'♕ '+n)].join('\\n');
 if(!txt){toast('No hay nombres');return}copy(txt)
}
function copy(txt){
 if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Nombres copiados'));
 else alert(txt);
}

function setTopDonor(){
  const n=prompt('Escribe el nombre del mejor donador:');
  if(!n||!n.trim())return;
  data.topDonor=n.trim();
  save();
  toast('Donador destacado');
}
function clearTopDonor(){
  if(!data.topDonor)return;
  data.topDonor='';
  save();
  toast('Donador quitado');
}
function openGoldName(){
  pendingType='gold';
  $('modalTitle').textContent='NOMBRE DORADO';
  $('modalInput').value='';
  $('tapIconPicker').style.display='none';
  $('modalBack').style.display='flex';
  setTimeout(()=>$('modalInput').focus(),50);
}

function settings(){alert('El panel guarda automáticamente los nombres en este dispositivo.')}
function toast(msg){
 const t=$('toast');t.textContent=msg;t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'),1300)
}
render();
</script>

<script>
if ('serviceWorker' in navigator) {
 window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
